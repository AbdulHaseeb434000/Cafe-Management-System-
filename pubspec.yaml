name: cafedesk
description: Offline Cafe & Restaurant Management System
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Local database
  sqflite: ^2.3.2
  path: ^1.9.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Thermal printer
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.0.9

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Charts
  fl_chart: ^0.68.0

  # Formatting
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.4.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
